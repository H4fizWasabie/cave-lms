name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # test.sh needs initdb and pg_ctl; the runner image usually ships them.
      - run: ls /usr/lib/postgresql/*/bin/initdb || { sudo apt-get update && sudo apt-get install -y postgresql; }
      - run: go vet ./...
      # Fails on a known CVE that the code can reach, in a dependency or in the Go standard library.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: ./test.sh
