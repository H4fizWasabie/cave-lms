<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Name}}</title>
</head>
<body>
  <main>
    <header class="dh">
      <div><h1>{{.Name}}</h1><p id="count"></p></div>
      <form class="df" id="filters" aria-label="Filters"></form>
    </header>
    <section class="dcards" id="cards"></section>
    <section class="dgrid" id="charts"></section>
  </main>
  <script src="charts.js"></script>
  <script>
    const dashboard = {{.Config}};
    fetch({{.Data}})
      .then(response => response.json())
      .then(rows => drawDashboard(dashboard, rows));
  </script>
</body>
</html>
