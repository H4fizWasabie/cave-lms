{{define "title"}}{{t .Lang "leave.title" .Course.Title}} · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap auth-page">
      <div class="auth-box">
        <h1>{{t .Lang "leave.question" .Course.Title}}</h1>
        <div class="callout"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-lock-simple"/></svg><p>{{t .Lang "leave.lab-locks"}}</p></div>
        <div class="form-foot">
          <a class="btn btn-quiet" href="/courses/{{.Course.ID}}">{{t .Lang "leave.stay"}}</a>
          <form method="post" action="/courses/{{.Course.ID}}/leave"><input type="hidden" name="confirm" value="yes"><button class="btn btn-danger-solid">{{t .Lang "leave.confirm"}}</button></form>
        </div>
      </div>
    </div>
{{end}}
