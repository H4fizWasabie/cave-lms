{{define "title"}}Delete Course · Admin · Cave LMS{{end}}
{{define "content"}}
    <h1>Delete Course</h1>
    {{with .Error}}<p role="alert">{{.}}</p>{{end}}
    {{with .Course}}{{if not $.Error}}
    <p>Delete &ldquo;{{.Title}}&rdquo;? This cannot be undone.</p>
    <form method="post" action="/admin/courses/{{.ID}}/delete"><button>Delete Course</button></form>
    {{end}}{{end}}
    <p><a href="/admin/courses">Cancel</a></p>
{{end}}
