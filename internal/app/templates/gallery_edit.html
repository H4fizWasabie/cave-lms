{{define "title"}}Edit Gallery item · Admin · Cave LMS{{end}}
{{define "content"}}
    <h1>Edit Gallery item</h1>
    {{with .Error}}<p role="alert">{{.}}</p>{{end}}
    <form method="post" action="/admin/gallery/{{.Item.ID}}">
      <p><label>Title <input type="text" name="title" value="{{.Item.Title}}" maxlength="200" required></label></p>
      <p><label>Description <textarea name="description" maxlength="2000">{{.Item.Description}}</textarea></label></p>
      <p><label>Category <input type="text" name="category" value="{{.Item.Category}}" maxlength="100"></label></p>
      <p><label>Visibility
        <select name="visibility">
          <option value="everyone"{{if eq .Item.Visibility "everyone"}} selected{{end}}>Everyone</option>
          <option value="learners"{{if eq .Item.Visibility "learners"}} selected{{end}}>Logged-in Learners</option>
        </select>
      </label></p>
      <p><label><input type="checkbox" name="promotional" value="on"{{if .Item.Promotional}} checked{{end}}> Promotional material</label></p>
      <button>Save</button>
    </form>
    <p><a href="/admin/gallery">Back to the Gallery list</a></p>
{{end}}
