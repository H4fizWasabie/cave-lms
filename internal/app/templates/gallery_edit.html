{{define "title"}}Edit Gallery item · Admin · CAVELMS{{end}}
{{define "content"}}
    <div class="adm">
      {{template "admin-side" (side "gallery" $.Learner)}}
      <div class="adm-main">
        <p class="crumbs"><a href="/admin/gallery">Back to the Gallery list</a></p>
        <div class="adm-head"><h1>Edit Gallery item</h1></div>
        <div class="card">
          {{with .Error}}<p class="field-err" role="alert">{{.}}</p>{{end}}
          <form class="form" method="post" action="/admin/gallery/{{.Item.ID}}">
            {{template "gallery-fields" .}}
            <div class="form-foot"><a class="btn btn-quiet" href="/admin/gallery">Cancel</a><button class="btn btn-solid">Save</button></div>
          </form>
        </div>
      </div>
    </div>
{{end}}
