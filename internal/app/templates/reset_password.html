{{define "title"}}Choose a new password · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap auth-page">
      <div class="auth-box">
        <h1>Choose a new password</h1>
        {{with .Error}}<p class="field-err" role="alert">{{.}}</p>{{end}}
        <form class="form" method="post" action="/reset-password">
          <input type="hidden" name="token" value="{{.Token}}">
          <div class="field"><label for="password">New password</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required><small>At least 8 characters.</small></div>
          <button class="btn btn-solid btn-block">Set new password</button>
        </form>
      </div>
    </div>
{{end}}
