{{define "title"}}{{t .Lang "reset.title"}} · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap auth-page">
      <div class="auth-box">
        <h1>{{t .Lang "reset.title"}}</h1>
        {{with .Error}}<p class="field-err" role="alert">{{.}}</p>{{end}}
        <form class="form" method="post" action="/reset-password">
          <input type="hidden" name="token" value="{{.Token}}">
          <div class="field"><label for="password">{{t .Lang "reset.new-password"}}</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required><small>{{t .Lang "account.password-hint"}}</small></div>
          <button class="btn btn-solid btn-block">{{t .Lang "reset.set"}}</button>
        </form>
      </div>
    </div>
{{end}}
