{{define "title"}}Log in · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap auth-page">
      <div class="auth-box">
        <h1>Log in</h1>
        <p class="auth-sub">Welcome back to CAVELMS.</p>
        {{with .Error}}<p class="field-err" role="alert">{{.}}</p>{{end}}
        <form class="form" method="post" action="/login">
          <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" value="{{.Email}}" autocomplete="email" required></div>
          <div class="field">
            <div class="field-row"><label for="password">Password</label><a class="small-link" href="/forgot-password">Forgot your password?</a></div>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-solid btn-block">Log in</button>
        </form>
        <p class="auth-alt">New here? <a href="/register">Register</a>.</p>
      </div>
    </div>
{{end}}
