{{define "title"}}{{t .Lang "nav.courses"}} · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap page-pad">
      <div class="page-head">
        <h1>{{t .Lang "nav.courses"}}</h1>
        <p>{{t .Lang "courses.intro"}}</p>
      </div>
      <ul class="catalogue">
        {{range .Courses}}{{template "course-card" (card . $.Lang)}}{{else}}
        <li class="empty">{{t .Lang "courses.none"}}</li>
        {{end}}
      </ul>
    </div>
{{end}}
