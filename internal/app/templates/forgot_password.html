{{define "title"}}Forgot your password · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap auth-page">
      <div class="auth-box">
        <h1>Forgot your password?</h1>
        <p class="auth-sub">Enter your email and we'll send you a link to choose a new password.</p>
        <form class="form" method="post" action="/forgot-password">
          <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required></div>
          <button class="btn btn-solid btn-block">Send reset link</button>
        </form>
        <p class="auth-alt"><a href="/login">Back to log in</a></p>
      </div>
    </div>
{{end}}
