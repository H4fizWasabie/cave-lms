{{define "title"}}{{t .Lang "account.forgot"}} · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap auth-page">
      <div class="auth-box">
        <h1>{{t .Lang "account.forgot"}}</h1>
        <p class="auth-sub">{{t .Lang "forgot.sub"}}</p>
        <form class="form" method="post" action="/forgot-password">
          <div class="field"><label for="email">{{t .Lang "account.email"}}</label><input id="email" type="email" name="email" autocomplete="email" required></div>
          <button class="btn btn-solid btn-block">{{t .Lang "forgot.send"}}</button>
        </form>
        <p class="auth-alt"><a href="/login">{{t .Lang "forgot.back"}}</a></p>
      </div>
    </div>
{{end}}
