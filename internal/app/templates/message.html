{{define "title"}}{{.Title}} · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap auth-page">
      <div class="auth-box">
        <h1>{{.Title}}</h1>
        <p class="auth-sub">{{.Message}}</p>
        {{if .OfferResend}}
        <form class="form" method="post" action="/verify/resend">
          <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" value="{{.Email}}" autocomplete="email" required></div>
          <button class="btn btn-solid btn-block">Send a new link</button>
        </form>
        {{end}}
        {{if .OfferLogin}}<p><a class="btn btn-solid" href="/login">Log in</a></p>{{end}}
        {{if .OfferReset}}<p><a class="btn btn-ghost" href="/forgot-password">Request a new reset link</a></p>{{end}}
      </div>
    </div>
{{end}}
