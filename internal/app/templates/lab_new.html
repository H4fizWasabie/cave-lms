{{define "title"}}{{t .Lang "lab.new"}} · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap page-pad">
      <p class="crumbs"><a href="/lab">Lab</a> / {{t .Lang "lab.new"}}</p>
      <div class="page-head"><h1>{{t .Lang "lab.new"}}</h1><p>{{t .Lang "lab.new.sub"}}</p></div>
      <section class="card">
        {{with .Error}}<p class="up-err" role="alert"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-warning-circle"/></svg>{{.}}</p>{{end}}
        <form class="form lab-create" method="post" action="/lab/dashboards">
          <div class="field"><label for="name">{{t .Lang "lab.new.name"}}</label><input id="name" type="text" name="name" value="{{.Name}}" required maxlength="80"></div>
          <div class="form-foot"><a class="btn btn-quiet" href="/lab">{{t .Lang "lab.cancel"}}</a><button class="btn btn-solid">{{t .Lang "lab.new.create"}}</button></div>
        </form>
      </section>
    </div>
{{end}}
