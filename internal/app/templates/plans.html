{{define "title"}}{{t .Lang "nav.plans"}} · CAVELMS{{end}}
{{define "content"}}
    <div class="wrap page-pad">
      <div class="page-head">
        <h1>{{t .Lang "nav.plans"}}</h1>
        <p>{{t .Lang "offers.intro"}}</p>
      </div>
      {{- template "offers" .}}
      {{- if not .Learner}}
      <div class="cta-row">
        <a class="btn btn-solid btn-lg" href="/login?next=%2Fplans">{{t .Lang "header.log-in"}}</a>
        <a class="btn btn-ghost btn-lg" href="/register">{{t .Lang "header.register"}}</a>
      </div>
      {{- end}}
    </div>
{{end}}
