.eb-name strong { font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.eb-kind { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--brand-gold-deep); background: var(--brand-gold-soft); border-radius: var(--radius); padding: .12rem .4rem; flex: none; width: 4.4rem; text-align: center; }

.eb-stage { background: #e4e4de; border-radius: var(--radius-lg); padding: .8rem; max-height: calc(100vh - 6rem); overflow: auto; }
dialog.eb-dlg { border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: 1.4rem; max-width: 30rem; }

.eb-b-dash.is-editing .dcard:hover, .eb-b-dash.is-editing .dpanel:hover { outline-color: var(--brand-gold); }
.eb-b-dash .is-sel { outline: 2px solid var(--brand-ink) !important; }
.eb-tools { position: absolute; top: .35rem; right: .35rem; display: none; gap: .1rem; background: #fff; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: .1rem; z-index: 2; }
.eb-b-dash.is-editing .dcard:hover .eb-tools, .eb-b-dash.is-editing .dpanel:hover .eb-tools, .eb-b-dash .is-sel .eb-tools { display: flex; }

.eb-pausedbar { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: .7rem 1rem; font-size: .9rem; margin-bottom: .8rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

.eb-drawer .eb-form { border-top: 0; }
.eb-b-top { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.eb-switch { display: inline-flex; gap: .5rem; align-items: center; font-weight: 600; cursor: pointer; }
/* Variant C: plain sentences, one step at a time, one block's preview beside it. */
.eb-c-list { display: grid; gap: .5rem; max-width: 46rem; }
.eb-c-row { display: grid; grid-template-columns: 2rem 1fr auto; gap: .8rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .65rem .8rem; }
.eb-c-row.is-paused { border-color: var(--bad); }
.eb-c-row p { margin: 0; font-size: .92rem; }
.eb-c-n { font-family: var(--font-display); font-size: 1.3rem; color: var(--brand-gold-deep); text-align: center; }
.eb-c-ed { display: grid; grid-template-columns: minmax(20rem, 34rem) 1fr; gap: 2rem; align-items: start; }
.eb-step { display: grid; gap: .6rem; padding: 1rem 0; border-top: 1px solid var(--line); }
.eb-step h3 { font-size: 1.05rem; display: flex; gap: .6rem; align-items: baseline; }
.eb-step h3 span { font-family: var(--font-display); color: var(--brand-gold-deep); }
.eb-kinds { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; }
.eb-kinds label { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: .6rem .4rem; text-align: center; cursor: pointer; background: #fff; display: grid; gap: .3rem; justify-items: center; font-size: .82rem; font-weight: 600; }

.eb-sentence { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; font-size: .98rem; }

// Variant C: a plain list on the Blocks tab; changing a block is a page of four plain steps, with that block alone beside it.
function sentenceValue(b, ds) {
  var v = b.value || {};
  if (b.kind === 'table') return kindFields(b, ds);
  if (v.agg === 'balance' || b.locked) return valueField(b, ds) + kindFields(b, ds).replace(valueField(b, ds), '');
  var aggSel = '<select data-k="value.agg">' + ['count', 'sum', 'avg', 'distinct', 'calc'].map(function (a) { return '<option value="' + a + '"' + (v.agg === a ? ' selected' : '') + '>' + t('agg.' + a).toLowerCase() + '</option>'; }).join('') + '</select>';
  var what = v.agg === 'sum' || v.agg === 'avg' ? '<select data-k="value.col">' + colOpts(ds, ['number'], v.col) + '</select>' : v.agg === 'distinct' ? '<select data-k="value.col">' + colOpts(ds, null, v.col) + '</select>' :
    v.agg === 'calc' ? '<select data-k="value.a">' + colOpts(ds, ['number'], v.a) + '</select><select data-k="value.op">' + [['+', '+'], ['-', '−'], ['x', '×'], ['/', '÷']].map(function (o) { return '<option value="' + o[0] + '"' + (v.op === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select><select data-k="value.b">' + colOpts(ds, ['number'], v.b) + '</select>' + t('calc.then') + seg('then-' + b.id, [['sum', t('calc.sum')], ['avg', t('calc.avg')]], v.then || 'sum') : '';
  var h = '<div class="eb-sentence">' + t('c.show') + ' ' + aggSel + what + '</div>';
  if (b.kind === 'line') h += '<div class="eb-sentence">' + t('c.over') + ' <select data-k="x">' + colOpts(ds, ['date'], b.x) + '</select>' + seg('by-' + b.id, [['day', t('by.day')], ['month', t('by.month')]], b.by || 'month') + '</div><div class="eb-sentence">' + t('c.each') + ' <select data-k="split">' + colOpts(ds, ['text'], b.split, t('none')) + '</select></div>';
  if (b.kind === 'bar' || b.kind === 'donut') h += '<div class="eb-sentence">' + t('c.per') + ' <select data-k="group">' + colOpts(ds, ['text'], b.group) + '</select></div>';
  if (b.kind === 'bar') h += '<div class="eb-sentence">' + t('f.split').toLowerCase() + ' <select data-k="split">' + colOpts(ds, ['text'], b.split, t('none')) + '</select></div><div class="eb-sentence">' + t('f.top') + seg('top-' + b.id, [[5, '5'], [8, '8'], [15, '15'], [0, t('top.all')]], b.top == null ? 8 : b.top) + '</div>';
  if (b.kind === 'donut') h += '<small class="muted">' + t('donut.other') + '</small>';
  return h;
}
var PICS = {
  card: '<rect x="4" y="6" width="40" height="22" rx="3" fill="none" stroke="currentColor"/><text x="10" y="22" font-size="11" font-weight="700" fill="currentColor">123</text>',
  line: '<polyline points="4,26 14,18 22,21 32,9 44,13" fill="none" stroke="currentColor" stroke-width="2"/>',
  bar: '<rect x="4" y="6" width="34" height="5" fill="currentColor"/><rect x="4" y="14" width="24" height="5" fill="currentColor"/><rect x="4" y="22" width="14" height="5" fill="currentColor"/>',
  donut: '<circle cx="24" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray="40 23"/>',
  table: '<path d="M4 7h40M4 14h40M4 21h40M4 28h40M18 7v21" stroke="currentColor" fill="none"/>',
};
function variantC() {
  var ds = dataset(), b = open != null && find(open);
  if (!b) {
    var list = '<div class="eb-c-list">' + blocks.map(function (b, i) {
      return '<div class="eb-c-row' + (missing(b, ds).length ? ' is-paused' : '') + '"><span class="eb-c-n">' + (i + 1) + '</span><div><p><strong>' + (b.locked ? icon('lock-simple') + ' ' : '') + esc(b.label) + '</strong> <span class="eb-kind" style="display:inline-block;width:auto">' + t('kind.' + b.kind) + '</span></p><p class="muted" style="font-size:.84rem">' + esc(summary(b, ds)) + (b.kind !== 'card' ? ' · ' + t(b.wide ? 'w.full' : 'w.half') : '') + '</p>' + flags(b, ds).replace(/eb-warn|eb-flag/g, '$& eb-c-f') + '</div>' +
        '<div style="display:flex;gap:.2rem;align-items:center"><button class="btn btn-ghost btn-sm" data-act="open" data-id="' + b.id + '">' + t('c.edit') + '</button>' + itemControls(b) + '</div></div>';
    }).join('') + '</div>';
    return shell('<p class="muted" style="margin-bottom:1rem">' + t('intro') + '</p>' + list + addButtons() +
      '<div class="eb-sect" style="max-width:46rem"><h3>' + t('filterbar') + '</h3><small class="muted">' + t('filterbar.help') + '</small>' + filterBarField(ds) + '</div>' +
      '<div class="eb-foot" style="max-width:46rem"><button class="btn btn-quiet btn-sm" data-act="reset">' + t('reset') + '</button><a class="btn btn-solid" href="#">' + t('tab.preview') + '</a></div>', 'blocks');
  }
  var kinds = '<div class="eb-kinds">' + ['card', 'line', 'bar', 'donut', 'table'].map(function (k) { return '<label><input type="radio" name="kind-' + b.id + '" value="' + k + '"' + (b.kind === k ? ' checked' : '') + (b.locked ? ' disabled' : '') + '><svg viewBox="0 0 48 32">' + PICS[k] + '</svg>' + t('kind.' + k) + '<small>' + t('kindh.' + k) + '</small></label>'; }).join('') + '</div>';
  var form = '<div data-form="' + b.id + '">' + pausedNote(b, ds) +
    '<div class="eb-step"><h3><span>1</span>' + t('c.step1') + '</h3>' + kinds + '</div>' +
    '<div class="eb-step"><h3><span>2</span>' + t('c.step2') + '</h3>' + sentenceValue(b, ds) + '</div>' +
    '<div class="eb-step"><h3><span>3</span>' + t('c.step3') + '</h3>' + filterField(b, ds) + '</div>' +
    '<div class="eb-step"><h3><span>4</span>' + t('c.step4') + '</h3><div class="field"><label>' + t('f.label') + '</label><input type="text" data-k="label" value="' + esc(b.label) + '"></div>' + (b.kind !== 'card' ? '<div class="field"><label>' + t('f.width') + '</label>' + seg('w-' + b.id, [['full', t('w.full')], ['half', t('w.half')]], b.wide ? 'full' : 'half') + '</div>' : '') + '</div></div>';
  var one = b.kind === 'card' ? '<div class="dash"><section class="dcards">' + (missing(b, ds).length ? '' : DRAW.card(b, filteredRows(ds), ds)) + '</section></div>' : '<div class="dash"><section class="dgrid">' + (missing(b, ds).length ? '' : DRAW[b.kind](Object.assign({}, b, { wide: true }), filteredRows(ds), ds, '', 640)) + '</section></div>';
  return shell('<p><button class="btn btn-quiet btn-sm" data-act="close">' + icon('caret-left') + t('c.back') + '</button></p><div class="eb-c-ed"><section>' + form +
    '<div class="eb-foot"><button class="btn btn-quiet btn-sm" data-act="remove" data-id="' + b.id + '">' + icon('trash') + t('remove') + '</button><button class="btn btn-solid" data-act="close">' + t('done') + '</button></div></section>' +
    '<aside class="eb-pv" style="position:sticky;top:1rem"><div class="eb-pvk"><span>' + t('c.this') + '</span></div><div class="eb-stage" id="pv">' + one + '</div></aside></div>', 'blocks');
}

// ---------- Variant switching and the prototype bar. ----------
var VARIANTS = { A: 'List beside the Dashboard', B: 'Edit on the Dashboard', C: 'Plain steps, one block at a time' };
var variant = new URLSearchParams(location.search).get('variant') || 'A';
function go(p) { var q = new URLSearchParams(location.search); Object.keys(p).forEach(function (k) { q.set(k, p[k]); }); location.search = q.toString(); }
function renderBar() {
  var keys = Object.keys(VARIANTS), i = keys.indexOf(variant);
  document.getElementById('bar').innerHTML = '<button id="prev">‹</button><span>' + variant + ' · ' + VARIANTS[variant] + '</span><button id="next">›</button>' +
    '<select id="scn">' + Object.keys(SCENARIOS).map(function (k) { return '<option value="' + k + '"' + (k === scenario ? ' selected' : '') + '>' + SCENARIOS[k] + '</option>'; }).join('') + '</select><button id="js">{ }</button>';
  document.getElementById('prev').onclick = function () { go({ variant: keys[(i + keys.length - 1) % keys.length] }); };
  document.getElementById('next').onclick = function () { go({ variant: keys[(i + 1) % keys.length] }); };
  document.getElementById('scn').onchange = function (e) { go({ scenario: e.target.value }); };
  document.getElementById('js').onclick = function () { var j = document.getElementById('json'); j.hidden = !j.hidden; renderJSON(); };
}
function renderJSON() { var j = document.getElementById('json'); if (!j.hidden) j.textContent = JSON.stringify({ filterBar: filterBar, blocks: blocks }, null, 1); }
function render() {
  var y = scrollY;
  document.getElementById('app').innerHTML = variant === 'B' ? variantB() : variant === 'C' ? variantC() : variantA();
  drawer(); renderJSON(); scrollTo(0, y);
  document.querySelectorAll('[data-lang]').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.lang === lang); });
}
function renderPreviewOnly() {
  var pv = document.getElementById('pv'); if (!pv) return;
  if (variant === 'A') pv.innerHTML = dashboard(760); else render();
  renderJSON();
}
document.addEventListener('change', function (e) {
  if (e.target.id === 'editing') { editing = e.target.checked; open = null; return render(); }
  if (e.target.closest('#bar')) return;
  handle(e);
});
document.addEventListener('input', labelInput);
document.addEventListener('click', function (e) {
  var l = e.target.closest('[data-lang]'); if (l) return go({ lang: l.dataset.lang });
  var fb = e.target.closest('[data-act="fbar"]'); if (fb) { open = 'fbar'; return render(); }
  if (e.target.closest('[data-act]')) return act(e);
  // In variant B a click anywhere on a block opens it.
  var blk = variant === 'B' && editing && e.target.closest('.eb-b-dash [data-b]');
  if (blk && !e.target.closest('select,.eb-tools')) { open = +blk.dataset.b; render(); }
  if (e.target.closest('a[href="#"]')) e.preventDefault();
});
addEventListener('keydown', function (e) {
  if (e.target.closest('input,select,textarea,[contenteditable]')) return;
  var keys = Object.keys(VARIANTS), i = keys.indexOf(variant);
  if (e.key === 'ArrowRight') go({ variant: keys[(i + 1) % keys.length] });
  if (e.key === 'ArrowLeft') go({ variant: keys[(i + keys.length - 1) % keys.length] });
  if (e.key === 'Escape' && open != null) { open = null; render(); }
});
renderBar(); render();
</script>
</body>
</html>
