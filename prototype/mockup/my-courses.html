<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My courses - The Cave Consult Learning</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-chrome="public" data-role="learner" data-page="myCourses">
<main class="page-pad">
  <div class="wrap">
    <div class="page-head">
      <h1>Welcome back, <span id="mc-name"></span></h1>
    </div>
    <section class="continue" id="mc-continue"></section>

    <div class="mc-grid">
      <section>
        <h2 class="h-md">My courses</h2>
        <ul class="mc-list" id="mc-list"></ul>
      </section>
      <section>
        <h2 class="h-md">My certificates</h2>
        <ul class="cert-list" id="mc-certs"></ul>
      </section>
    </div>

    <section class="mc-more">
      <h2 class="h-md">More courses to join</h2>
      <ul class="course-grid" id="mc-more"></ul>
    </section>
  </div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
