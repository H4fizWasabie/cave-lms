<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses - Learning admin</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body data-chrome="admin" data-page="adminCourses" data-section="Courses">
<main class="adm-main">
  <div class="adm-head">
    <div>
      <h1>Courses</h1>
      <p>Open a course to let Learners join it. Closing it stops new joins, and current Learners keep their access.</p>
    </div>
    <div class="adm-head-actions">
      <a class="btn btn-solid" href="admin-course.html?new=1"><svg class="i" aria-hidden="true"><use href="img/icons.svg#i-plus"/></svg>New course</a>
    </div>
  </div>
  <section class="card card-flush">
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Course</th><th>Joining</th><th class="num">Lessons</th><th>Exam</th><th class="num">Enrolled</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody id="ac-rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
