<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson - The Cave Consult Learning</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-chrome="public" data-role="learner" data-page="lesson">
<main class="lesson-page">
  <div class="wrap lesson-in">
    <aside class="outline">
      <a class="outline-course" id="l-course" href="#"></a>
      <div class="cont-prog" id="l-prog"></div>
      <ol class="outline-list" id="l-outline"></ol>
    </aside>
    <article class="lesson">
      <p class="lesson-kicker" id="l-kicker"></p>
      <h1 id="l-title"></h1>
      <div id="l-body"></div>
      <div class="lesson-banner" id="l-banner" hidden></div>
      <div class="lesson-foot">
        <a class="btn btn-quiet" id="l-prev" href="#">Previous</a>
        <button class="btn btn-done" type="button" id="l-done" aria-pressed="false"></button>
        <a class="btn btn-solid" id="l-next" href="#">Next lesson</a>
      </div>
    </article>
  </div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
